server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # API proxy to Uvicorn
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Swagger / OpenAPI
    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Hashed React assets — cache forever
    location /assets/ {
        alias /home/ubuntu/netguard-ai/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # React SPA catch-all
    location / {
        root   /home/ubuntu/netguard-ai/frontend/dist;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options  "nosniff"     always;
    add_header Referrer-Policy         "strict-origin" always;

    access_log /var/log/nginx/netguard-ai-access.log;
    error_log  /var/log/nginx/netguard-ai-error.log;
}
